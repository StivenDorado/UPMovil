name: upmovil
description: "Aplicación de alquiler de propiedades"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.7
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.1.0
  http: ^1.2.0
  intl: ^0.18.1
  provider: ^6.0.5
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  firebase_core: ^2.32.0
  firebase_auth: ^4.18.1
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.6.6
  google_sign_in: ^6.2.3
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/default-image.jpg
    - assets/images/
    - assets/images/logo.png

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
